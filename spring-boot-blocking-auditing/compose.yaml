# Local Postgres and Kafka for ./mvnw spring-boot:run. The tests do not need this: they use Testcontainers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditing
      POSTGRES_USER: auditing
      POSTGRES_PASSWORD: auditing
    ports:
      - "5432:5432"
  kafka:
    image: apache/kafka:3.8.0   # single-node KRaft broker, listening on localhost:9092
    ports:
      - "9092:9092"
